# Automated Forex data fetch + signal analysis
# Runs every 15 minutes. Uses Node 20 (built-in fetch, node:test).
#
# Required repository secret (set in GitHub repo → Settings → Secrets):
#   TWELVEDATA_API_KEY  — your free Twelve Data API key
#
# The workflow:
#   1. Checks out the repo
#   2. Runs the fetch+analyze script (reads key from secret, NEVER commits it)
#   3. If new data/signals exist, commits and pushes back to the repo
#   4. GitHub Pages automatically serves the updated data to the dashboard
name: Forex Analysis

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:        # allow manual run from Actions tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit data back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data & generate signals
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node actions/fetch-and-analyze.mjs --verbose

      - name: Run engine tests
        run: node --test engine/__tests__/

      - name: Commit & push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data or signals to commit."
          else
            git commit -m "chore: auto-update data & signals [bot]"
            git push
          fi
